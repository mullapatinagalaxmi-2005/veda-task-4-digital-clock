<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock | Veda Task 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-container">
    <p class="tag">VEDA TECHNOLOGY · TASK 4</p>
    <h1>Digital Clock</h1>
    <p class="subtitle">Current local time</p>

    <div class="clock" aria-label="Current time">
      <span id="hours">00</span>
      <span class="colon">:</span>
      <span id="minutes">00</span>
      <span class="colon">:</span>
      <span id="seconds">00</span>
    </div>

    <p id="date"></p>
    <p class="status">● Live clock running</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
